services:
  app:
    build: .
    image: medecho:1.0.0
    container_name: medecho
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5173"
      DB_PATH: /app/data/medecho.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
    volumes:
      - medecho-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  medecho-data:
